name: PR Gate

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Full gate
    # Keep the same-repository guard and stable hosted-browser baselines.
    # The separate readiness job checks the repaired private runner identity.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          # action-setup installs into a fixed ~/setup-pnpm by default. Several repo-scoped
          # runners share one box here, so concurrent jobs raced and left a truncated binary
          # (exit 127) or EACCES. runner.temp is per-job, which removes the shared path.
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Workflow contract
        run: node tools/check-offload-workflow.mjs .github/workflows/pr-gate.yml

      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install
        # pnpm derives its store from PNPM_HOME, which the dest above moved into
        # the per-job _temp dir — without this the store is wiped every run.
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"

      # Hosted runners are disposable; install the real browser system dependencies.
      - name: Install Playwright browsers
        run: pnpm --filter @vibeflare/ui exec playwright install --with-deps chromium

      - name: Build
        run: pnpm run build

      - name: Verify canonical logo assets
        run: node tools/verify-logo-assets.mjs

      - name: Validate generated Cloudflare config
        run: pnpm validate:wrangler

      - name: Audit production dependencies
        run: pnpm security:audit

      - name: Test
        run: pnpm run test

      # The playwright config self-starts the app via its webServer block, so no service needs to be
      # stood up around this step.
      - name: E2E
        run: pnpm --filter @vibeflare/ui run test:e2e

      - name: Retain browser verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence
          path: apps/ui/test-results/
          if-no-files-found: warn
          retention-days: 3

  runner-readiness:
    name: VibeFlare runner readiness
    # Never execute fork-provided code on the persistent private host.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: vibeflare-arc-k3s
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Verify canonical repository and workflow guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "alexcodeplace/vibeflare"
          node tools/check-offload-workflow.mjs .github/workflows/pr-gate.yml
          printf 'Runner %s is ready for %s at %s\n' "$RUNNER_NAME" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
