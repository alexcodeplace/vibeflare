# Canonical local-development template.
# `vf setup` never edits this file. It generates an installation-specific
# Wrangler config under the user's XDG state directory for Cloudflare deploys.
name = "vibeflare"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Bootstrap the daily maintenance Durable Object independently of request traffic.
# Hourly is intentionally sparse but bounds recovery after a fresh deployment.
[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[vars]
RP_NAME = "VibeFlare"
AUTH_MODE = "standalone"
RP_ID = "localhost"
RP_ORIGIN = "http://localhost:8787"
CF_ACCOUNT_ID = "local-development"

[[d1_databases]]
binding = "DB"
database_name = "vibeflare-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "src/db/migrations"

[ai]
binding = "AI"

[[r2_buckets]]
binding = "R2"
bucket_name = "vibeflare-local-files"

# [[analytics_engine_datasets]]
# binding = "METRICS"
# dataset = "vibeflare_metrics"

[assets]
binding = "ASSETS"
directory = "../ui/dist"
not_found_handling = "none"
run_worker_first = ["/", "/signup", "/signup/*"]

[durable_objects]
bindings = [
  { name = "QUOTA", class_name = "QuotaCounter" },
  { name = "AUTH_RL", class_name = "AuthRateLimiter" },
  { name = "CRON", class_name = "CronScheduler" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaCounter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AuthRateLimiter"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["CronScheduler"]
