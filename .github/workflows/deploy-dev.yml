name: Deploy development

# Development deployment for the cloudflare@spargax.com account migration.
# Targets account f534e78871386f9ba3ca05944abfc8c2 as Worker vibeflare-dev with
# fresh dev D1/R2/Durable Object state; never touches the production Worker or
# the legacy account. Manual dispatch only.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vibeflare-development
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: development
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify Cloudflare development target
        env:
          EXPECTED_ACCOUNT_ID: f534e78871386f9ba3ca05944abfc8c2
        run: |
          set -e
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo 'Missing CLOUDFLARE_API_TOKEN' >&2; exit 1; }
          [ -n "$SESSION_SECRET" ] || { echo 'Missing SESSION_SECRET' >&2; exit 1; }
          [ "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED_ACCOUNT_ID" ] || { echo 'Cloudflare account does not match the VibeFlare development target' >&2; exit 1; }
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")
          [ "$status" = 200 ] || { echo 'Cloudflare token is not active for the development account' >&2; exit 1; }
      - name: Build
        run: pnpm build:cloudflare
      - name: Apply development D1 migrations
        run: pnpm --filter @vibeflare/worker exec wrangler d1 migrations apply DB --remote --config ../../wrangler.dev.toml
      - name: Deploy development Worker
        run: pnpm --filter @vibeflare/worker exec wrangler deploy --config ../../wrangler.dev.toml
      - name: Configure development session secret
        run: printf '%s' "$SESSION_SECRET" | pnpm --filter @vibeflare/worker exec wrangler secret put SESSION_SECRET --config ../../wrangler.dev.toml
      - name: Smoke-check development origin
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://vibeflare-dev.spargax.workers.dev/)
          echo "GET / -> $status"
          case "$status" in 200|301|302|308) ;; *) exit 1 ;; esac
